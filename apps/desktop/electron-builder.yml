appId: com.moduspilot.desktop
productName: MODUS Desktop
directories:
  output: out
  buildResources: build
files:
  - dist/**/*
  - assets/**/*
mac:
  category: public.app-category.productivity
  icon: assets/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Notarization (notarytool) — credentials from env: APPLE_ID,
  # APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
  notarize: true
  # dmg = initial download; zip = required by electron-updater for auto-updates.
  target:
    - target: dmg
      arch: arm64
    - target: zip
      arch: arm64
# Auto-update + release artifacts go to GitHub Releases on the repo.
publish:
  provider: github
  owner: joinFITR
  repo: moduspilot
