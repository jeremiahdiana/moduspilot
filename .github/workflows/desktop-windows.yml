name: Desktop (Windows)

# Windows installers can't be built on macOS (no wine), so the Mac release is cut
# locally and this job builds + uploads the Windows .exe to that same release.
# Fires when a release is published (electron-builder cuts it as a draft; publishing
# it triggers this) and can be run by hand.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build + publish Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          # apps/desktop is NOT in the root npm workspace — it has its own
          # package-lock — so deps must be installed inside it, like apps/mobile.
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install
        working-directory: apps/desktop
        run: npm ci

      - name: Build TypeScript
        working-directory: apps/desktop
        run: npm run build

      # UNSIGNED on purpose (see electron-builder.yml). Build only — do NOT let
      # electron-builder publish: it insists on a DRAFT release and skips the
      # upload when the matching release is already PUBLISHED ("existing type not
      # compatible"). We upload with gh instead, straight to the published release.
      - name: Build installer
        working-directory: apps/desktop
        run: npx electron-builder --win --publish never

      - name: Upload to the matching release
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "uploading Windows artifacts to $TAG"
          gh release upload "$TAG" \
            "out/MODUS-Desktop-x64.exe" \
            "out/MODUS-Desktop-x64.exe.blockmap" \
            "out/latest.yml" \
            --repo "${{ github.repository }}" --clobber
